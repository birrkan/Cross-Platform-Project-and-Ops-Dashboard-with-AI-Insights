# ─────────────────────────────────────────────────────────
# ansible.cfg — Global Ansible configuration
# ─────────────────────────────────────────────────────────
# Reference: https://docs.ansible.com/ansible/latest/reference_appendices/config.html
# ─────────────────────────────────────────────────────────

[defaults]
# Roles are in roles/ (resolved relative to project root)
roles_path = roles

# Default inventory (still passable with -i)
inventory = inventory/production.yml

# Display output in a readable format
default_result_format = yaml

# Don't gather facts unless a playbook explicitly asks for them
gathering = explicit

# Don't create .retry files on failure
retry_files_enabled = False

# Skip host key checking (lab environment)
host_key_checking = False
