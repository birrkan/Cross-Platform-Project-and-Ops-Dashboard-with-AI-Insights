# ─────────────────────────────────────────────────────────
# 02-llamacpp.yml — Install llama.cpp on the server
# ─────────────────────────────────────────────────────────
# Installs the llama.cpp CLI natively, sets up model cache
# directories, and creates a systemd service for the server.
#
# Reference: https://github.com/ggml-org/llama.cpp
# ─────────────────────────────────────────────────────────

- name: Install llama.cpp
  hosts: server
  become: true
  gather_facts: true
  roles:
    - llamacpp
