# ─────────────────────────────────────────────────────────
# all.yml — All configurable variables
# ─────────────────────────────────────────────────────────
# Grows as the project grows. Only what's needed, nothing more.
#
# Reference: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html
